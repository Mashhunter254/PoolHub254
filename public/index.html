<body>
<a class="skip" href="#app">Skip to content</a>

<header class="topbar">
  <a class="brand" href="#/" aria-label="PoolHub home">
    <span class="ball">9</span>
    <span class="brand-text">Pool<b>Hub</b></span>
  </a>

  <nav class="mainnav" aria-label="Main" data-nav-group>
    <a href="#/" data-nav="home">Home</a>
    <a href="#/live" data-nav="live"><span class="nav-dot" aria-hidden="true"></span>Live</a>

    <a href="#/rankings" data-nav="rankings">Rankings</a>
    <a href="#/activity" data-nav="activity">Activity</a>
  </nav>

  <div class="topbar-side">

<nav class="tabbar" aria-label="Main" data-nav-group>
  <a href="#/" data-nav="home">

  <a href="#/events" data-nav="events">

  <a href="#/me" data-nav="me">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
    <span>Me</span>

</nav>
